[package]
name = "knobdeck-protocol"
version = "0.1.0"
edition = "2021"
description = "The KnobDeck plugin protocol: every wire frame, defined once for the host and every SDK"
license = "MIT"
repository = "https://github.com/Knobdeck/knobdeck-sdk"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# `schema`: JSON Schema for every frame (the generated files in `schema/` come from it).
schemars = { version = "1", optional = true, features = ["preserve_order"] }

[features]
schema = ["dep:schemars"]
