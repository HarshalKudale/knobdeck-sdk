[package]
name = "knobdeck-os"
version = "0.4.1"
edition = "2021"
description = "Windows, focus, selection, selected files, clipboard and installed apps on Windows, macOS and Linux: one implementation for the KnobDeck host and its plugins"
license = "MIT"
repository = "https://github.com/Knobdeck/knobdeck-sdk"

[features]
default = ["window", "apps"]
# Foreground / target window, window list, focus, and the event-driven watcher.
window = []
# The installed-app list (Start menu apps, .app bundles, XDG desktop entries).
apps = ["dep:plist"]
# The focused UI element of the target app (role, editable, password): UI Automation, AX, AT-SPI.
focus = ["window", "dep:windows"]
# The target app's selected text (Linux falls back to the PRIMARY selection).
selection = ["focus", "clipboard"]
# The files selected in File Explorer / Finder / a Linux file manager, and the folder it shows
# (Linux reads them from the PRIMARY selection, hence `clipboard`).
files = ["window", "clipboard", "dep:windows"]
# Placeholders in action text ({selection}, {date:%Y-%m-%d}…): the parser and escaping.
placeholders = ["dep:chrono"]
# The clipboard's kinds, text, files and image, read only.
clipboard = ["dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-wlr"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", optional = true, default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Shell",
] }
# UI Automation (COM) for `focus` / `selection`.
windows = { version = "0.61", optional = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
block2 = "0.6"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSDictionary", "NSNotification", "NSOperation", "NSURL", "NSData", "NSEnumerator", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSPasteboard", "NSPasteboardItem"] }
plist = { version = "1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# D-Bus for the KWin script and the GNOME Shell extension (pure Rust, no libdbus).
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
x11rb = "0.13"
# `clipboard` on Wayland: the ext / wlr data-control protocols.
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", optional = true, features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", optional = true, features = ["client"] }
