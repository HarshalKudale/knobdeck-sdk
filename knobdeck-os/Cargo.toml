[package]
name = "knobdeck-os"
version = "0.1.0"
edition = "2021"
description = "Windows, focus and installed apps on Windows, macOS and Linux: one implementation for the KnobDeck host and its plugins"
license = "MIT"
repository = "https://github.com/HarshalKudale/knobdeck-sdk"

[features]
default = ["window", "apps"]
# Foreground / target window, window list, focus, and the event-driven watcher.
window = []
# The installed-app list (Start menu apps, .app bundles, XDG desktop entries).
apps = ["dep:plist"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
block2 = "0.6"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSDictionary", "NSNotification", "NSOperation", "NSURL", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
plist = { version = "1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# D-Bus for the KWin script and the GNOME Shell extension (pure Rust, no libdbus).
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
x11rb = "0.13"
